name: Build Treasure APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Treasure APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download AutoJs6 6.7.0 template APK
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/SuperMonster003/AutoJs6/releases/download/v6.7.0/autojs6-v6.7.0-universal-047ae62e.apk" \
            --output autojs6-template.apk

      - name: Build standalone Treasure APK
        uses: Steven-Qiang/AutoJs6-ApkBuilder@main
        with:
          autojs: autojs6-template.apk
          source: .
          output: Treasure.apk

      - name: Upload Treasure APK
        uses: actions/upload-artifact@v4
        with:
          name: Treasure-apk
          path: Treasure.apk
          if-no-files-found: error
          retention-days: 14
